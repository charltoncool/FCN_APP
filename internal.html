function copyText(s,m){const done=()=>alert(m||'已複製，請貼到 LINE 傳給設計者，並附上畫面截圖。');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(done,()=>fbc(s,done));else fbc(s,done)}

function bkImp(mode){const m=t=>{const e=$('#bkm');if(e)e.textContent=t};try{const s=($('#bki').value||'').trim();if(!s.startsWith('FCNC1.'))throw 0;const d=JSON.parse(decodeURIComponent(escape(atob(s.slice(6)))));if(!d||d.v!==1||!Array.isArray(d.fav)||typeof d.amt!=='object'||!Array.isArray(d.ex)||!Array.isArray(d.grp))throw 0;
 if(mode==='over'){if(!confirm('用備份碼「覆蓋」這支手機目前的追蹤清單、投資金額、群組與分公司選擇？'))return;S.fav=d.fav;S.amt=d.amt||{};S.ko=d.ko||{};S.ex=d.ex;S.hide=d.hide||[];S.grp=d.grp;S.sr=d.sr||{};S.cg=d.cg||'all';S.sort=d.sort||'asc';S.ord=d.ord||[];if(d.br&&BR[d.br])S.br=d.br}
 else{S.fav=[...new Set(S.fav.concat(d.fav))];Object.assign(S.amt,d.amt||{});Object.assign(S.ko,d.ko||{});d.ex.forEach(r=>{S.ex=S.ex.filter(x=>x[0]!==r[0]);S.ex.push(r)});S.hide=[...new Set(S.hide.concat(d.hide||[]))];Object.assign(S.sr,d.sr||{});if(d.ord&&d.ord.length&&!S.ord.length){S.sort=d.sort||'asc';S.ord=d.ord}d.grp.forEach(g=>{const o=gOf(g.id);if(o)Object.assign(o.m,g.m);else S.grp.push(g)})}
 save();build();render();$('#bki').value='';m('匯入完成：'+S.fav.length+' 張未分組合約、'+S.grp.length+' 個群組、')}catch(e){m('備份碼格式不正確，請確認完整貼上（以 FCNC1. 開頭）')}}
