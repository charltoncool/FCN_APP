function libT(){const k=q.toUpperCase();return `<div class="card"><b>新增合約的方式</b><div class="tk" style="line-height:1.8">① 在下方商品庫點 ★（手動，可填投資金額）<br>② 貼上商品 JSON 建檔（由 FC 統一提供）<br>③ 拍照辨識確認版單張（即將推出）</div><button class="btn g2" onclick="$('#jb').style.display='block'">② 貼上商品 JSON</button><div id="jb" style="display:none"><textarea id="js" rows="4" placeholder="貼上商品 JSON"></textarea><button class="btn" onclick="imp()">匯入</button></div><div id="im" class="note"></div></div>
 <input placeholder="搜尋編號或標的（如 NVDA）" value="${q}" oninput="q=this.value;$('#ll').innerHTML=ll()"><div id="ll" style="margin-top:10px">${ll()}</div>`}
const ll=()=>{const k=q.toUpperCase();return PR.filter(p=>!k||p.c.includes(k)||p.u.some(u=>u.k.includes(k))).map(p=>`<div class="card" onclick="openS('${p.c}')"><div class="row"><div><div class="code">${p.c}</div><div class="tk">${p.u.map(u=>u.k).join('・')}　${fd(p.tr)}</div></div><button class="star ${S.fav.includes(p.c)?'on':''}" onclick="event.stopPropagation();tog('${p.c}')">★</button></div></div>`).join('')||'<div class="note">沒有符合的商品</div>'};
function imp(){try{const n=(v,t)=>v>t?v/100:v,dd=s=>s.slice(2,4)+s.slice(5,7)+s.slice(8,10);[].concat(JSON.parse($('#js').value)).forEach(o=>{const P=o.periods,u0=o.underlyings[0];S.ex=S.ex.filter(r=>r[0]!==o.code);S.ex.push([o.code,dd(o.tradeDate),n(P[0].couponRate,.5),+(u0.eki/u0.initialPrice).toFixed(3),P.map(x=>[dd(x.obsStart),dd(x.obsEnd),dd(x.payDate),n(x.koLevel,3)].join()).join(';'),o.underlyings.map(u=>u.code.replace(/\..*/,'')+':'+u.initialPrice).join()])});save();build();$('#js').value='';render();$('#im').textContent='匯入完成'}catch(e){$('#im').textContent='匯入失敗：JSON 格式有誤'}}
function setT(){return `<h2>股價來源（Google 試算表）</h2><input id="url" value="${S.url||DEF}"><button class="btn" onclick="S.url=$('#url').value.trim();save();pull()">讀取股價</button><textarea id="pt" rows="4" style="margin-top:8px" placeholder="或直接貼上：代號 股價（例 NVDA 228.5）"></textarea><button class="btn g2" onclick="{const t=$('#pt').value;parseH(t);apx(parsePx(t))}">套用貼上內容</button><div id="msg" class="note"></div>
 <div class="note">已有股價 ${[...TK].filter(k=>S.px[k]).length}/${TK.size} 檔。追蹤清單與投資金額只存在這支手機，不會上傳。本工具為內部參考，非官方對帳文件；股價為延遲／收盤參考價，KO、KI 判定一律以發行機構計算代理人結果為準。iPhone：Safari 分享→加入主畫面即可像 App 使用。</div>`}
function parsePx(t){const o={};t.split(/\r?\n/).forEach(l=>{const c=l.split(/,|\t| /).map(x=>x.replace(/"/g,'').trim());for(let i=0;i<c.length;i++){const k=c[i].replace(/^.*:/,'').replace(/\.US$/i,'').toUpperCase();if(TK.has(k)){const n=c.slice(i+1).map(x=>parseFloat(x.replace(/[$,]/g,''))).find(x=>x>0);if(n){o[k]=n;break}}}});return o}
function apx(o){if(!Object.keys(o).length){const p=$('#pxs');p&&(p.textContent='沒有讀到股價');msg('沒有讀到股價');return}S.px=Object.assign(S.px,o);S.pxd=new Date().toISOString();save();render();msg(`已載入 ${Object.keys(o).length} 檔`)}
const msg=t=>{const e=$('#msg');if(e)e.textContent=t},ltm=s=>{const d=new Date(s),z=n=>String(n).padStart(2,'0');return z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())};
async function pull(){const p=$('#pxs');p&&(p.textContent='讀取中…');try{const r=await fetch(S.url||DEF);if(!r.ok)throw 0;const t=await r.text();parseH(t);apx(parsePx(t))}catch(e){const m='股價讀取失敗，請確認網路後再按一次';p&&(p.textContent=m);msg('讀取失敗：試算表需開放「知道連結者可檢視」或發布為 CSV；也可改用貼上')}}
function tog(c){const i=S.fav.indexOf(c);i<0?S.fav.push(c):S.fav.splice(i,1);save();render();$('#sheet.on')&&openS(c)}
const US_H=new Set(['2026-01-01','2026-01-19','2026-02-16','2026-04-03','2026-05-25','2026-06-19','2026-07-03','2026-09-07','2026-11-26','2026-12-25','2027-01-01','2027-01-18','2027-02-15','2027-03-26','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-11-25','2027-12-24']);
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,bdy=d=>d.getDay()%6!==0&&!US_H.has(dk(d));
const bd=(a,b)=>{let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))bdy(d)&&n++;return n},wd=(a,n)=>{const d=new Date(a);while(n>0){d.setDate(d.getDate()+1);bdy(d)&&n--}return d};
function koCalc(p,v){const d=new Date(v+'T00:00:00');if(isNaN(d))return null;let i=-1;if(d.getTime()===p.ps[0].e.getTime())i=0;else p.ps.forEach((x,n)=>{if(n&&d>=x.s&&d<=x.e)i=n});if(i<0)return null;const x=p.ps[i];return{i,d,r:i?bd(x.s,d)/bd(x.s,x.e):1,pay:wd(d,3)}}
function sched(p,c,a){const v=S.ko[c],kc=typeof v==='string'?koCalc(p,v):null,m=x=>a?'$'+fm(a*x):'$'+fm(1e4*x)+'/萬',H='<tr><th>期</th><th>給付日</th><th>KO比例</th><th>配息</th></tr>';
 if(!kc)return `<table>${H}${p.ps.map((x,n)=>`<tr><td>${n+1}</td><td>${fd(x.p)}</td><td>${(x.k*100).toFixed(0)}%</td><td>${m(p.r)}</td></tr>`).join('')}</table>`;
 let tot=0;const rows=p.ps.slice(0,kc.i+1).map((x,n)=>{const f=n===kc.i,rt=f?p.r*kc.r:p.r;tot+=rt;return `<tr class="${f?'hl':''}"><td>${n+1}${f?`<small>${kc.i?'不足月':'出場'}</small>`:''}</td><td>${fd(f?kc.pay:x.p)}</td><td>${(x.k*100).toFixed(0)}%</td><td>${m(rt)}</td></tr>`}).join('');
 return `<table>${H}${rows}<tr class="hl"><td colspan="3">配息合計（含不足月）</td><td>${m(tot)}</td></tr>${a?`<tr><td colspan="3">加計本金 $${fm(a)} 後總額</td><td>$${fm(a*(1+tot))}</td></tr>`:''}</table><div class="note" style="margin-top:6px">KO 日 ${fd(kc.d)}（第${kc.i+1}期）。${kc.i?'不足月配息依該期持有的美國營業日比例計算；':''}出場給付日為 KO 後第 3 個美國營業日。未計手續費與稅，一切以受託機構交割為準。</div>`}
function setKo(c,v){v?S.ko[c]=v:delete S.ko[c];save();render();openS(c)}
function setAmt(c,v){S.amt[c]=+v||0;save();render();openS(c)}
const closeS=()=>$('#sheet').classList.remove('on');
function openS(c){const p=PR.find(x=>x.c===c),i=info(p),a=S.amt[c]||0,lv=(i.cur||p.ps[0]).k,nx=nxt(p,i);
 $('#sb').innerHTML=`<div class="row"><div class="code" style="font-size:18px">${c}</div><button class="star ${S.fav.includes(c)?'on':''}" onclick="tog('${c}')">★</button></div><div style="margin:6px 0 10px">${chip(p)}</div>${i.lk&&i.lk.ko?`<div class="note" style="margin:-4px 0 8px">依收盤價歷史推算：最早於 ${fd(i.lk.ko)} 三檔皆已鎖定（記憶式，僅供參考）。實際以發行機構公告為準，若不符請自行用下方按鈕標記。</div>`:''}
 <table><tr><th>標的</th><th>期初</th><th>參考價</th><th>KO價</th><th>下限價</th></tr>${p.u.map(u=>{const x=S.px[u.k];return `<tr><td>${u.k}</td><td>${fm(u.i)}</td><td>${x?fm(x):'-'}</td><td>${fm(u.i*lv)}</td><td>${fm(u.i*p.e)}</td></tr>`}).join('')}</table>
 <h2>KO 遞減表（美國日期）</h2><table><tr><th>期</th><th>起算日</th><th>KO</th>${p.u.map(u=>`<th>${u.k}</th>`).join('')}</tr>${p.ps.map((x,n)=>`<tr class="${i.cur===x?'hl':''}"><td>${n+1}</td><td>${n?fd(x.s):fd(x.e)+'<small>單日</small>'}</td><td>${(x.k*100).toFixed(0)}%</td>${p.u.map(u=>`<td>${fm(u.i*x.k)}</td>`).join('')}</tr>`).join('')}</table><div class="note" style="margin-top:6px">${nx?nx+'。':''}第1期只在期末當天比價一次，之後每日比價，KO 價逐期遞減；標色列為目前適用的一期。</div>
 <h2>配息日程（美國日期）</h2>${sched(p,c,a)}
 <div style="margin-top:10px"><div class="tk">投資金額（USD，只存本機）</div><input type="number" inputmode="numeric" value="${a||''}" placeholder="例如 100000" onchange="setAmt('${c}',this.value)"></div>
 <div style="margin-top:10px"><div class="tk">KO 日期（美股收盤日，輸入後自動計算不足月配息）</div><input type="date" value="${typeof S.ko[c]==='string'?S.ko[c]:''}" onchange="setKo('${c}',this.value)"></div>${typeof S.ko[c]==='string'&&!koCalc(p,S.ko[c])?`<div class="note" style="color:#C2410C">這個日期不在 KO 觀察範圍內（最早為 ${fd(p.ps[0].e)}），請確認。</div>`:''}${S.ko[c]?`<button class="btn g2" onclick="setKo('${c}','')">取消「已出場」</button>`:''}<button class="btn" onclick="closeS()">關閉</button>
 <div class="note">月配息率 ${(p.r*100).toFixed(4)}%（年化 ${(p.r*1200).toFixed(2)}%）。KO 每日觀察、記憶式；KI 僅期末訂價日比價。參考價非官方收盤價，一切以發行機構及受託機構資料為準。</div>`;$('#sheet').classList.add('on')}
function render(){const v={home,mine:mineT,stk:stkT,lib:libT,set:setT};$('#m').innerHTML=v[tab]();
 $('#pxs').textContent=S.pxd?'股價 '+ltm(S.pxd)+' 更新':'尚未載入股價';
 $('#nav').innerHTML=[['home','🧭','首頁'],['mine','📋','我的合約'],['stk','📊','個股'],['lib','🗂','商品庫'],['set','⚙️','設定']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><i>${x[1]}</i>${x[2]}</button>`).join('')}
render();pull();
</script></body></html>
