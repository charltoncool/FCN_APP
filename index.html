 `<div class="note">含息損益兩平價＝履約價 −（累計配息 ÷ 接股股數），代表接股後股價回到這個價格，連同已領配息，整體損益為零。以美元計，未計手續費、匯率與稅；接股股數、餘款以上手交割為準。</div>`}
